[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srf"
version = "0.1.0"
description = "Scientific Research Factory — 13 AI-driven scientific discovery harnesses as flat-DAG refactory workflows"
requires-python = ">=3.12"
dependencies = [
    # SRF's graphs are built from refactory's vocabulary; SRF supplies no runtime.
    "remote-factory",
    "structlog>=24.1.0",
    "pydantic>=2.10",
    "networkx>=3.6.1",
    "pyyaml>=6.0",
]

[project.scripts]
srf = "srf.cli:main"

[tool.setuptools.packages.find]
include = ["srf*"]

[tool.setuptools.package-data]
"srf" = ["tasks/**/*.yaml", "tools/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
