fork_research:
  type: ForkNode
  id: fork_research
  targets: researcher_existing,researcher_intent,researcher_practices
  edges_out:
  - target: researcher_existing
    condition: null
  - target: researcher_intent
    condition: null
  - target: researcher_practices
    condition: null
researcher_existing:
  type: AgentNode
  id: researcher_existing
  role: researcher
  blocking: 'true'
  reads: []
  writes:
  - .factory/strategy/research-existing.md
  edges_out:
  - target: join_research
    condition: null
  slots:
    task_prompt_researcher_existing: 'Existing workflow analysis. If the CEO task
      includes ''## Create Mode (Update Existing Mode)'', read the **Target mode:**
      field and focus your analysis on that specific mode''s workflow definition via
      `factory workflow show <target_mode>`. Document its current node sequences,
      gate logic, edge wiring, trigger function, and reads/writes. Also read its SKILL.md
      at skills/workflow-<target_mode>/SKILL.md for the generated playbook. Otherwise,
      read factory/workflow/definitions.py and analyze all existing workflow definitions
      (build, design, create, spec-generate). Document common patterns: node sequences,
      gate conventions, fork/join patterns, archivist placement, edge wiring, trigger
      functions, reads/writes declarations. Read factory/workflow/primitives.py for
      available node types and their fields. Read factory/workflow/skill_export.py
      for WORKFLOW_META format. Write findings to .factory/strategy/research-existing.md
      covering: node type usage patterns, common subgraphs (builder→gate→qa→gate loop),
      trigger function conventions, data flow patterns.

      Write output to: .factory/strategy/research-existing.md'
    timeout_researcher_existing: '600'
researcher_intent:
  type: AgentNode
  id: researcher_intent
  role: researcher
  blocking: 'true'
  reads: []
  writes:
  - .factory/strategy/research-intent.md
  edges_out:
  - target: join_research
    condition: null
  slots:
    task_prompt_researcher_intent: 'Mode description analysis. Read the user''s mode
      description from the CEO task. If the CEO task includes ''## Create Mode (Plugin
      Package)'', parse the **output_folder** and plugin-specific constraints (standalone
      package, entry point registration, no upstream modifications). Structure the
      plugin packaging requirements: pyproject.toml entry point, workflow file layout,
      register_plugin() function pattern, installation and verification steps. Write
      findings to .factory/strategy/research-intent.md covering: structured requirements,
      packaging needs, workflow node candidates. Otherwise, if the CEO task includes
      ''## Create Mode (Update Existing Mode)'', parse the **Requested changes:**
      field and structure the requested modifications against the existing mode''s
      current behavior. Identify which nodes, edges, prompts, or gates need to change
      and which must remain untouched. Otherwise, parse and structure the description
      into a new workflow specification: - Purpose and trigger conditions - Agent
      roles needed (which specialists) - Gate logic (user vs agent vs fn evaluators)
      - Data flow (what files are read/written) - Interactive vs headless requirements
      - Input format (text, file, drawing, flow) Write findings to .factory/strategy/research-intent.md
      covering: structured requirements, node candidates, suggested graph topology.

      Write output to: .factory/strategy/research-intent.md'
    timeout_researcher_intent: '600'
researcher_practices:
  type: AgentNode
  id: researcher_practices
  role: researcher
  blocking: 'true'
  reads: []
  writes:
  - .factory/strategy/research-practices.md
  edges_out:
  - target: join_research
    condition: null
  slots:
    task_prompt_researcher_practices: 'Workflow design best practices. Search the
      web for workflow and pipeline design patterns relevant to the described mode.
      Look for: DAG design patterns, agent orchestration patterns, quality gate strategies,
      error recovery approaches. Check .factory/archive/ for lessons from past mode
      creation or workflow changes. Write findings to .factory/strategy/research-practices.md
      covering: relevant design patterns, pitfalls to avoid, testing strategies.

      Write output to: .factory/strategy/research-practices.md'
    timeout_researcher_practices: '600'
join_research:
  type: JoinNode
  id: join_research
  sources: researcher_existing,researcher_intent,researcher_practices
  reads: []
  writes: []
  edges_out:
  - target: gate_research
    condition: null
gate_research:
  type: GateNode
  id: gate_research
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/strategy/research-existing.md
  - .factory/strategy/research-intent.md
  - .factory/strategy/research-practices.md
  edges_out:
  - target: strategist
    condition: PROCEED
  - target: fork_research
    condition: RELOOP
  slots:
    gate_prompt_gate_research: Are the existing workflow patterns well-documented?
      Is the user's intent clearly structured into workflow requirements? Are best
      practices relevant to this type of mode? Any gaps?
    max_iterations_gate_research: '3'
strategist:
  type: AgentNode
  id: strategist
  role: strategist
  blocking: 'true'
  reads:
  - .factory/strategy/research-existing.md
  - .factory/strategy/research-intent.md
  - .factory/strategy/research-practices.md
  writes:
  - .factory/strategy/current.md
  edges_out:
  - target: gate_strategy
    condition: null
  slots:
    task_prompt_strategist: 'Synthesize a workflow specification. Read ALL tagged
      research files at .factory/strategy/research-*.md. If the CEO task includes
      ''## Create Mode (Update Existing Mode)'', produce a change spec describing
      modifications to the existing workflow: which nodes/edges/prompts/gates to modify,
      what to add or remove, and a diff-oriented implementation plan. Include the
      20-point verification checklist from the CEO task. Do NOT produce a complete
      new workflow definition — describe changes to the existing one. Otherwise, produce
      a complete specification for a new factory mode including: 1) Python code for
      the workflow function (nodes dict, edges list, trigger) 2) WORKFLOW_META entry
      (description, argument_hint) 3) CLI wiring changes (build_parser mode choices,
      cmd_ceo routing, _build_ceo_task section) 4) Test cases (graph validation, skill
      export, trigger function, registration) 5) Node details: for each node, specify
      id, type, role, prompt_template, reads, writes 6) Edge details: for each edge,
      specify source, target, condition 7) Interactive vs headless behavior Follow
      conventions from existing workflows — use the same patterns for builder→gate→QA→gate
      loops, archivist placement, and research forks. Write the specification to .factory/strategy/current.md.

      Read: .factory/strategy/research-existing.md, .factory/strategy/research-intent.md,
      .factory/strategy/research-practices.md

      Write output to: .factory/strategy/current.md'
    timeout_strategist: '600'
gate_strategy:
  type: GateNode
  id: gate_strategy
  evaluator_type: user
  reads:
  - .factory/strategy/current.md
  edges_out:
  - target: archivist_plan
    condition: PROCEED
  - target: strategist
    condition: RELOOP
  slots:
    max_iterations_gate_strategy: '3'
archivist_plan:
  type: AgentNode
  id: archivist_plan
  role: archivist
  blocking: 'false'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/archive/create-plan.md
  edges_out:
  - target: builder
    condition: null
  slots:
    task_prompt_archivist_plan: 'Archive the approved workflow specification for the
      new mode.

      Read: .factory/strategy/current.md

      Write output to: .factory/archive/create-plan.md'
    timeout_archivist_plan: '300'
builder:
  type: AgentNode
  id: builder
  role: builder
  blocking: 'true'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: gate_build
    condition: null
  slots:
    task_prompt_builder: 'Implement the workflow changes from the approved specification.
      Read the approved spec at .factory/strategy/current.md. Read CLAUDE.md for project
      conventions. If the CEO task includes ''## Create Mode (Plugin Package)'', follow
      the PLUGIN checklist: 1) Read **output_folder** from the CEO task 2) Create
      the output directory: mkdir -p <output_folder> 3) Write pyproject.toml with:    name
      factory-<mode-name>-workflow, version 0.1.0,    build-system hatchling, requires-python
      >=3.11,    dependencies [remote-factory],    entry point [factory.plugins] <mode-name>
      = ''<mode_name>:register_plugin'' 4) Write <mode_name>.py with:    meta dict
      (name, description),    workflow() function returning a Workflow object,    register_plugin(registry)
      calling registry.add_modes() and    registry.add_workflow_search_path(str(Path(__file__).parent))
      5) Write README.md with installation and usage 6) Test: pip install -e <output_folder>/
      7) Verify: factory workflow list shows the mode 8) Validate: factory workflow
      validate <mode-name> 9) Clean up: pip uninstall -y factory-<mode-name>-workflow
      The plugin package stays in the output directory — do NOT commit it to the factory
      repo or open a PR. It is a standalone artifact. Do NOT modify factory/workflow/definitions.py
      or register_all(). Otherwise, if the CEO task includes ''## Create Mode (Update
      Existing Mode)'', follow the update checklist: modify the existing workflow
      function in definitions.py, verify the register_all() entry still resolves,
      update WORKFLOW_META if needed, verify all 20 registration points from the CEO
      task, run factory workflow validate <name>, regenerate SKILL.md via factory
      workflow export-skills, update tests, run pytest and ruff check. Otherwise,
      follow the new-mode checklist for portable workflows: 1) Create $PROJECT_PATH/.factory/workflows/
      directory if it doesn''t exist 2) Write the workflow file to $PROJECT_PATH/.factory/workflows/<name>.py
      3) The file must contain a `meta` dict with `name` and `description` keys, and
      a `workflow()` function returning a Workflow object 4) Only import from factory.workflow.primitives
      and stdlib — no other factory internals 5) Do NOT modify factory/workflow/definitions.py,
      register_all(), WORKFLOW_META, or CLI wiring — the workflow registry discovers
      .factory/workflows/ automatically 6) Run factory workflow validate <name> --project-path
      $PROJECT_PATH to verify the graph 7) Run factory workflow export-skills --project-path
      $PROJECT_PATH to generate the SKILL.md 8) Write tests in tests/ 9) Run pytest
      and ruff check to verify Commit changes and open a draft PR.

      Read: .factory/strategy/current.md

      Write output to: .factory/reviews/builder-latest.md'
    timeout_builder: '1800'
gate_build:
  type: GateNode
  id: gate_build
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: fork_qa
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_build: 'Read builder output and PR diff. Does work match the
      approved spec? For plugin packages: verify output directory contains pyproject.toml,
      workflow .py with meta + workflow() + register_plugin(), and README.md. Verify
      NO upstream factory files were modified. For new modes: verify workflow file
      exists at .factory/workflows/<name>.py with meta dict and workflow() function,
      NOT patched into definitions.py. For existing mode updates: verify definitions.py
      changes are correct. Tests written. REDIRECT if any component is missing.'
    max_iterations_gate_build: '3'
fork_qa:
  type: ForkNode
  id: fork_qa
  targets: health_checker,code_reviewer,adversarial_tester
  edges_out:
  - target: join_qa
    condition: null
health_checker:
  type: AgentNode
  id: health_checker
  role: health_checker
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/health-check.md
  edges_out: []
  slots:
    task_prompt_health_checker: 'Execute health_checker task for the project.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/health-check.md'
    timeout_health_checker: '600'
code_reviewer:
  type: AgentNode
  id: code_reviewer
  role: code_reviewer
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/code-review.md
  edges_out: []
  slots:
    task_prompt_code_reviewer: 'Execute code_reviewer task for the project.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/code-review.md'
    timeout_code_reviewer: '900'
adversarial_tester:
  type: AgentNode
  id: adversarial_tester
  role: adversarial_tester
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/adversarial-qa.md
  edges_out: []
  slots:
    task_prompt_adversarial_tester: '**Plugin mode check:** If the CEO task includes
      ''## Create Mode (Plugin Package)'', verify the plugin package structure: 1)
      Output directory exists at the specified output_folder path. 2) pyproject.toml
      exists with [project.entry-points.''factory.plugins''] section. 3) Workflow
      .py file has meta dict + workflow() + register_plugin() function. 4) README.md
      documents installation and usage. 5) Run: pip install -e <folder>/ (must succeed).
      6) Run: factory workflow list (must show the new mode). 7) Run: factory workflow
      validate <mode-name> (must pass). 8) Run: pip uninstall -y factory-<mode-name>-workflow
      (cleanup). Verify NO upstream factory files were modified (definitions.py, register_all,
      etc). **Project-local mode check:** Otherwise, for new modes: verify the workflow
      was written to .factory/workflows/<name>.py (NOT to definitions.py). Run: factory
      workflow validate <name> --project-path $PROJECT_PATH, factory workflow show
      <name> --project-path $PROJECT_PATH. Verify SKILL.md generated under skills/workflow-<name>/.
      Check workflow handles both interactive and headless paths.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/adversarial-qa.md'
    timeout_adversarial_tester: '1800'
join_qa:
  type: JoinNode
  id: join_qa
  sources: health_checker,code_reviewer,adversarial_tester
  reads:
  - .factory/reviews/adversarial-qa.md
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  writes: []
  edges_out:
  - target: gate_qa
    condition: null
gate_qa:
  type: GateNode
  id: gate_qa
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/adversarial-qa.md
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  edges_out:
  - target: gate_doc_freshness
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_qa: 'Review QA results for the new mode. PROCEED if all checks
      pass: workflow validates, SKILL.md generated, tests pass, CLI recognizes mode.
      RELOOP to builder (max 3 iterations) if issues found.'
    max_iterations_gate_qa: '3'
gate_doc_freshness:
  type: GateNode
  id: gate_doc_freshness
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/adversarial-qa.md
  edges_out:
  - target: gate_precheck
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_doc_freshness: Check the PR diff for documentation freshness.
      If public APIs, CLI commands, configuration options, or architecture were changed
      or added, corresponding documentation (README.md, CLAUDE.md, docstrings, --help
      text, or doc/ files) MUST be updated. PROCEED if docs are current or no doc-worthy
      changes exist. RELOOP to builder if documentation is stale — specify exactly
      which changes need doc updates.
    max_iterations_gate_doc_freshness: '3'
gate_precheck:
  type: GateNode
  id: gate_precheck
  evaluator_type: fn
  evaluator_command: factory precheck {project_path} --score-before 0 --score-after
    0
  reads:
  - .factory/reviews/adversarial-qa.md
  edges_out:
  - target: archivist_build
    condition: PROCEED
  - target: archivist_build
    condition: HALT
archivist_build:
  type: AgentNode
  id: archivist_build
  role: archivist
  blocking: 'false'
  reads:
  - .factory/reviews/adversarial-qa.md
  writes:
  - .factory/archive/create-build.md
  edges_out: []
  slots:
    task_prompt_archivist_build: 'Archive the new mode build results and learnings.

      Read: .factory/reviews/adversarial-qa.md

      Write output to: .factory/archive/create-build.md'
    timeout_archivist_build: '300'
