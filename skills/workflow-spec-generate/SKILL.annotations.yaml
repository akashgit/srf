extract:
  type: FnNode
  id: extract
  command: factory graph extract {project_path}
  reads: []
  writes:
  - graph.json
  edges_out:
  - target: gate_extract
    condition: null
gate_extract:
  type: GateNode
  id: gate_extract
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - graph.json
  edges_out:
  - target: annotate
    condition: PROCEED
  - target: extract
    condition: RELOOP
  slots:
    gate_prompt_gate_extract: Check that graph.json was produced. Verify it contains
      nodes and edges. PROCEED if the graph was extracted successfully. RELOOP if
      missing or empty.
    max_iterations_gate_extract: '3'
annotate:
  type: AgentNode
  id: annotate
  role: researcher
  blocking: 'true'
  reads:
  - graph.json
  writes:
  - SPEC.md
  edges_out:
  - target: gate_annotate
    condition: null
  slots:
    task_prompt_annotate: 'Read the code knowledge graph at graph.json. Read the spec_annotator
      prompt at factory/agents/prompts/spec_annotator.md. Produce a two-tier behavioral
      spec with RFC 2119 normative language. Use [[graph:...]] reference links for
      granular module details. Write output to SPEC.md in the project root.

      Read: graph.json

      Write output to: SPEC.md'
    timeout_annotate: '600'
gate_annotate:
  type: GateNode
  id: gate_annotate
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - SPEC.md
  edges_out:
  - target: validate
    condition: PROCEED
  - target: annotate
    condition: RELOOP
  slots:
    gate_prompt_gate_annotate: 'Review the annotated spec at SPEC.md. Check: do module
      behavioral contracts match the actual code? Does the spec use RFC 2119 normative
      language (MUST/SHOULD/MAY)? Are there scoring tables (there should NOT be)?
      SECTION COMPLETENESS CHECK — verify ALL of the following sections are present
      and non-empty:  Problem Statement,  Goals and Non-Goals (including.1 Goals.2
      Non-Goals.3 Design Philosophy),  Project Identity,  Technical Stack,  Architecture
      Overview,  Domain Model,  State Machines and Lifecycles,  Module Specifications,  Shared
      Contracts,  Configuration Specification,  Entry Points,  Failure Model and Recovery,  Security
      and Safety,  Test and Validation Matrix,  Extension Points,  Implementation
      Checklist, Appendix A: Reference Algorithms. RELOOP if ANY section is missing
      or empty. PROCEED only if ALL 16 sections + Appendix A are present and non-empty.'
    max_iterations_gate_annotate: '3'
validate:
  type: FnNode
  id: validate
  command: factory spec validate {project_path}
  reads:
  - SPEC.md
  writes:
  - .factory/spec_validation.md
  edges_out:
  - target: gate_validate
    condition: null
gate_validate:
  type: GateNode
  id: gate_validate
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - SPEC.md
  edges_out: []
  slots:
    gate_prompt_gate_validate: Final quality gate for the repo spec. Read SPEC.md.
      Is it complete, well-structured, and under 24K tokens? PROCEED to finish.
